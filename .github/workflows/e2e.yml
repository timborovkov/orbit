name: E2E

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_dev
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start RustFS and create private test bucket
        run: |
          docker compose up -d --wait rustfs
          bun run storage:setup
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: orbit-test
          S3_ACCESS_KEY_ID: orbit_local
          S3_SECRET_ACCESS_KEY: orbit_local_storage_only
      - name: Apply test database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_test
      - name: Build web
        run: bun run build
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Test persistence, accessibility and interface states
        run: bun run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
