name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate code and require React Doctor 100
        run: bun run validate
      - name: Build web
        run: bun run build
      - name: Fast unit tests
        run: bun run test:unit

  full-validation:
    name: Full validation
    if: github.base_ref == 'production' || github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_dev
          POSTGRES_DB: orbit_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install smoke test dependencies
        run: bun install --frozen-lockfile
      - name: Migrate worker smoke database
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_smoke
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t orbit-web:ci .
      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t orbit-worker:ci .
      - name: Process a fixture with the worker image
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@127.0.0.1:5432/orbit_smoke
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          trap 'docker logs orbit-worker-ci; docker rm -f orbit-worker-ci' EXIT
          docker run -d --name orbit-worker-ci \
            --network "container:$POSTGRES_CONTAINER" \
            -e DATABASE_URL -e ORBIT_WORKER_ID=ci-smoke \
            orbit-worker:ci
          bun scripts/worker-smoke.ts
          docker stop --timeout 10 orbit-worker-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' orbit-worker-ci)" = 0
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Smoke test web container
        run: |
          docker run -d --rm --name orbit-web-ci -p 127.0.0.1:3000:3000 orbit-web:ci
          trap 'docker stop orbit-web-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              curl --fail --silent http://127.0.0.1:3000/icon.svg > /dev/null
              curl --fail --silent http://127.0.0.1:3000/theme.js > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs orbit-web-ci
          exit 1

  integration:
    name: PostgreSQL integration
    if: github.base_ref == 'production' || github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_dev
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply test database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_test
      - name: Test durable job queue
        run: bun run test:queue
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_test
      - name: Test simulation persistence and isolation
        run: bun run test:simulation
      - name: Test worker and web integration
        run: bun test tests/worker-integration.test.ts
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_test
          APP_URL: http://localhost:3000
          AUTH_DISABLED: 'false'
          ORBIT_ADMIN_EMAIL: admin@example.com
          ORBIT_ADMIN_PASSWORD: test-only-password-123456
          ORBIT_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Start RustFS for knowledge objects
        run: |
          docker compose up -d --wait rustfs
          bun run storage:setup
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: orbit
          S3_ACCESS_KEY_ID: orbit_local
          S3_SECRET_ACCESS_KEY: orbit_local_storage_only
      - name: Test knowledge RAG pipeline
        run: bun run test:knowledge
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_test
          APP_URL: http://localhost:3000
          AUTH_DISABLED: 'false'
          ORBIT_ADMIN_EMAIL: admin@example.com
          ORBIT_ADMIN_PASSWORD: test-only-password-123456
          ORBIT_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: orbit
          S3_ACCESS_KEY_ID: orbit_local
          S3_SECRET_ACCESS_KEY: orbit_local_storage_only
          KNOWLEDGE_EMBEDDING_STUB: 'true'
