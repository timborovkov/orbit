name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate code and require React Doctor 100
        run: bun run validate
      - name: Build web
        run: bun run build

  full-validation:
    name: Full validation
    if: github.base_ref == 'production' || github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t orbit-web:ci .
      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t orbit-worker:ci .
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Smoke test web container
        run: |
          docker run -d --rm --name orbit-web-ci -p 127.0.0.1:3000:3000 orbit-web:ci
          trap 'docker stop orbit-web-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs orbit-web-ci
          exit 1

  integration:
    name: PostgreSQL and browser integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_dev
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply test database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://orbit:orbit_dev@localhost:5432/orbit_test
      - name: Build web
        run: bun run build
      - name: Test auth configuration and production startup guards
        run: bun run test:unit
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Test persistence, accessibility and interface states
        run: bun run test:e2e
      - name: Upload browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-results
          path: test-results/
