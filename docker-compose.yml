name: orbit

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev
      POSTGRES_DB: orbit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 5s
      retries: 10
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-orbit_local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-orbit_local_storage_only}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://orbit:orbit_dev@postgres:5432/orbit
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ORBIT_ADMIN_EMAIL: ${ORBIT_ADMIN_EMAIL:-}
      ORBIT_ADMIN_PASSWORD: ${ORBIT_ADMIN_PASSWORD:-}
      ORBIT_ENCRYPTION_KEY: ${ORBIT_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-orbit}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orbit_local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orbit_local_storage_only}
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://orbit:orbit_dev@postgres:5432/orbit
      ORBIT_ENCRYPTION_KEY: ${ORBIT_ENCRYPTION_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      ORBIT_WORKER_ID: ${ORBIT_WORKER_ID:-compose-worker}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rustfs_data:
  postgres_data:
