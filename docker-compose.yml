name: orbit

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev
      POSTGRES_DB: orbit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://orbit:orbit_dev@postgres:5432/orbit
      APP_URL: ${APP_URL:-http://localhost:3000}
      ORBIT_ADMIN_EMAIL: ${ORBIT_ADMIN_EMAIL:-}
      ORBIT_ADMIN_PASSWORD: ${ORBIT_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/worker.Dockerfile

volumes:
  postgres_data:
